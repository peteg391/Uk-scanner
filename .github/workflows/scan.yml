name: UK scanner

on:
  schedule:
    - cron: "5,35 7-17 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install yfinance pandas numpy lxml requests
      - name: Scan
        run: python scanner.py
      - name: Save stock list and history
        continue-on-error: true
        run: |
          date -u +%F > last_run.txt
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add universe.csv last_run.txt history.csv
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "Daily heartbeat"
          for i in 1 2 3; do
            git pull --rebase -X theirs --autostash origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
